<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GyanPay - Secure Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 26px;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #34495e;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #3498db;
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #2980b9;
        }
        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GyanPay</h1>
        <p>सुरक्षित और तेज़ डिजिटल भुगतान मंच</p>
        
        <div class="form-group">
            <label for="mobile">मोबाइल नंबर दर्ज करें</label>
            <input type="tel" id="mobile" placeholder="अपना 10 अंकों का नंबर लिखें" maxlength="10">
        </div>

        <div class="form-group">
            <label for="amount">राशि (₹)</label>
            <input type="number" id="amount" placeholder="रुपये दर्ज करें">
        </div>

        <button class="btn" onclick="processPayment()">भुगतान करें</button>
        
        <div class="footer-text">
            &copy; 2026 GyanPay. All rights reserved.
        </div>
    </div>

    <script>
        function processPayment() {
            const mobile = document.getElementById('mobile').value;
            const amount = document.getElementById('amount').value;
            
            if(mobile.length < 10 || !amount) {
                alert('कृपया सही मोबाइल नंबर और राशि दर्ज करें!');
                return;
            }
            
            alert('₹' + amount + ' का भुगतान सफल रहा (मोबाइल: ' + mobile + ')');
        }
    </script>

</body>
</html>
