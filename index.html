<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GyanPay - Admin Panel</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 15px; background: var(--card-bg); border-radius: 10px; }
        h1 { font-size: 1.5rem; color: #38bdf8; }
        .home-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }

        .container { width: 100%; max-width: 900px; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .hidden { display: none !important; }

        input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 0.95rem; }
        button.primary-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.primary-btn:hover { opacity: 0.9; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: left; font-size: 0.9rem; }
        th { background: #0f172a; color: #38bdf8; }
        
        .approve-btn { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .reject-btn { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .screenshot-thumb { width: 50px; height: 50px; object-fit: cover; cursor: pointer; border-radius: 4px; border: 1px solid #38bdf8; }
        
        .section-title { font-size: 1.2rem; color: #38bdf8; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>GyanPay Admin Control</h1>
        <a href="index.html" class="home-btn">User Home</a>
    </header>

    <!-- Admin Login Section -->
    <div id="admin-login-container" class="container">
        <h2>एडमिन लॉगिन</h2>
        <input type="password" id="admin-pass" placeholder="एडमिन पिन/पासवर्ड दर्ज करें (डिफ़ॉल्ट: admin123)">
        <button class="primary-btn" onclick="loginAdmin()">लॉगिन करें</button>
    </div>

    <!-- Admin Dashboard Section -->
    <div id="admin-dashboard" class="container hidden">
        
        <!-- Quiz Control Panel (10 Questions & Timer Settings) -->
        <div style="margin-bottom: 30px;">
            <div class="section-title">⏱️ क्विज़ और टाइमर सेटिंग्स (10 सवाल प्रति क्विज़)</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label>प्रत्येक सवाल का टाइमर (सेकंड में):</label>
                    <input type="number" id="quiz-timer-limit" value="10">
                </div>
                <div>
                    <label>क्विज़ लाइव शुरू होने का समय (मिनट बाद):</label>
                    <input type="number" id="quiz-start-delay" value="5">
                </div>
            </div>
            <button class="primary-btn" onclick="saveQuizSettings()">क्विज़ सेटिंग्स सेव करें</button>
        </div>

        <!-- User Approvals & Screenshots Table -->
        <div style="margin-bottom: 30px;">
            <div class="section-title">👥 यूज़र अप्रूवल और पेमेंट स्क्रीनशॉट वेरिफिकेशन</div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>नाम</th>
                            <th>मोबाइल</th>
                            <th>पेमेंट स्क्रीनशॉट</th>
                            <th>स्टेटस</th>
                            <th>स्कोर / टियर</th>
                            <th>कार्रवाई</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Security / Password Change -->
        <div>
            <div class="section-title">🔒 एडमिन सुरक्षा सेटिंग्स</div>
            <input type="password" id="new-admin-pass" placeholder="नया एडमिन पासवर्ड/पिन दर्ज करें">
            <button class="primary-btn" style="background: var(--warning); color: #000;" onclick="updatePassword()">एडमिन पिन बदलें</button>
        </div>
    </div>

    <script>
        function loginAdmin() {
            let pass = document.getElementById('admin-pass').value;
            let savedPass = localStorage.getItem('gyan_admin_pass') || 'admin123';

            if(pass === savedPass) {
                document.getElementById('admin-login-container').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadAdminData();
            } else {
                alert('गलत पासवर्ड! कृपया पुनः प्रयास करें।');
            }
        }

        function loadAdminData() {
            let users = JSON.parse(localStorage.getItem('gyan_users')) || [];
            let tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            if(users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">कोई यूज़र रजिस्टर्ड नहीं है।</td></tr>`;
                return;
            }

            users.forEach((user, index) => {
                let screenshotHTML = user.screenshot ? `<img src="${user.screenshot}" class="screenshot-thumb" onclick="window.open('${user.screenshot}')" title="बड़ा देखने के लिए क्लिक करें">` : 'स्क्रीनशॉट नहीं';
                let actionHTML = '';
                
                if(user.status === 'Pending') {
                    actionHTML = `
                        <button class="approve-btn" onclick="updateUserStatus(${index}, 'Approved')">Approve</button>
                        <button class="reject-btn" onclick="updateUserStatus(${index}, 'Rejected')">Reject</button>
                    `;
                } else {
                    actionHTML = `<b>${user.status}</b>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td>${user.name}</td>
                        <td>${user.phone}</td>
                        <td>${screenshotHTML}</td>
                        <td><b>${user.status}</b></td>
                        <td>${user.score !== undefined ? user.score + '/10 (' + user.tier + ')' : 'खेला नहीं'}</td>
                        <td>${actionHTML}</td>
                    </tr>
                `;
            });

            // Load saved settings if any
            let savedTimer = localStorage.getItem('gyan_timer_limit') || 10;
            let savedDelay = localStorage.getItem('gyan_start_delay') || 5;
            document.getElementById('quiz-timer-limit').value = savedTimer;
            document.getElementById('quiz-start-delay').value = savedDelay;
        }

        function updateUserStatus(index, newStatus) {
            let users = JSON.parse(localStorage.getItem('gyan_users')) || [];
            users[index].status = newStatus;
            localStorage.setItem('gyan_users', JSON.stringify(users));
            alert(`यूज़र का स्टेटस '${newStatus}' कर दिया गया है!`);
            loadAdminData();
        }

        function saveQuizSettings() {
            let timerLimit = document.getElementById('quiz-timer-limit').value;
            let startDelay = document.getElementById('quiz-start-delay').value;
            
            localStorage.setItem('gyan_timer_limit', timerLimit);
            localStorage.setItem('gyan_start_delay', startDelay);
            alert('क्विज़ टाइमर और सेटिंग्स सफलतापूर्वक सेव हो गई हैं!');
        }

        function updatePassword() {
            let newPass = document.getElementById('new-admin-pass').value.trim();
            if(!newPass) {
                alert('कृपया नया पासवर्ड दर्ज करें!');
                return;
            }
            localStorage.setItem('gyan_admin_pass', newPass);
            alert('एडमिन पासवर्ड सफलतापूर्वक बदल दिया गया है!');
            document.getElementById('new-admin-pass').value = '';
        }
    </script>
</body>
</html>
