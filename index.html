<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="2ZbgudfG9eMURVyG1uOCnzjWCv8sKq898-uU1UIxtwY" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GyanPey - Quiz & Earn Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #f8fafc; }
        .glow-frame {
            animation: pulse-glow 3s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
        }
        .reward-banner { animation: pulse-glow 3s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Top Header -->
    <header class="w-full max-w-md flex justify-between items-center py-3 px-2 border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <span class="bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded-lg text-sm">GP</span>
            <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500">GyanPey</h1>
        </div>
        <div id="headerAuthButtons" class="flex space-x-2">
            <button onclick="openAuth('login')" class="text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-lg font-medium border border-slate-700">Login</button>
            <button onclick="openAuth('register')" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg font-medium">Register</button>
        </div>
        <div id="headerUserLogout" class="hidden flex items-center space-x-2">
            <span id="topUserName" class="text-xs text-amber-400 font-bold"></span>
            <button onclick="logoutUser()" class="text-xs bg-slate-800 text-red-400 px-2.5 py-1.5 rounded-lg border border-slate-700">Logout</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md my-auto py-4">

        <!-- HOME SCREEN -->
        <div id="homeScreen" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl text-center backdrop-blur-md">
            <div class="w-16 h-16 bg-amber-500/25 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 glow-frame">
                <i class="fas fa-trophy text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Play Quiz & Win Real Rewards</h2>
            <p class="text-xs text-slate-400 mb-6">प्रोजेक्ट शुरू करें, नॉलेज बढ़ाएं और शानदार इनाम जीतें।</p>
            
            <div class="bg-slate-800/60 border border-slate-800 p-4 rounded-xl mb-6">
                <p class="text-xs text-slate-300 mb-1"><i class="fas fa-clock text-amber-400 mr-1.5"></i>अगला राउंड शुरू होने में</p>
                <div id="timerClock" class="text-xl font-mono font-bold text-amber-400">00:00:00</div>
            </div>

            <button onclick="openAuth('login')" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition transform active:scale-95">
                क्लिक करके खेलें (Login to Play)
            </button>
        </div>

        <!-- AUTH SCREEN -->
        <div id="authScreen" class="hidden bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="authHeading" class="text-lg font-bold text-white">लॉगिन करें</h3>
                <button onclick="showHomeScreen()" class="text-slate-400 hover:text-white text-xs"><i class="fas fa-times text-base"></i></button>
            </div>
            <div class="space-y-4 text-xs">
                <div id="regNameDiv">
                    <label class="block text-slate-300 mb-1">पूरा नाम</label>
                    <input type="text" id="inputName" placeholder="अपना नाम लिखें" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1">मोबाइल नंबर</label>
                    <input type="tel" id="inputPhone" placeholder="10 अंकों का मोबाइल नंबर" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-slate-300 mb-1">पासवर्ड</label>
                    <input type="password" id="inputPass" placeholder="अपना पासवर्ड डालें" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
                <button onclick="submitAuth()" id="authSubmitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl transition">लॉगिन करें (Login)</button>
                <div class="text-center pt-2">
                    <a href="#" onclick="toggleAuthMode()" id="authSwitchText" class="text-amber-400 hover:underline">नया खाता बनाएं? (Register)</a>
                </div>
            </div>
        </div>

    </main>

    <footer class="w-full max-w-md text-center text-xs text-slate-500 py-2">
        &copy; 2026 GyanPey. All rights reserved.
    </footer>

</body>
</html>
